<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12243a"><title>Atlas Assistente</title>
<style>
:root{color-scheme:dark;--bg:#0b1422;--panel:#12243a;--line:#29415d;--text:#eef5ff;--muted:#a9bbd0;--accent:#58c4a5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1422,#13283b);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(780px,100%);min-height:100vh;display:flex;flex-direction:column;padding:18px;gap:14px}.head{display:flex;align-items:center;gap:12px;padding:8px 2px 16px;border-bottom:1px solid var(--line)}.logo{width:48px;height:48px;border-radius:15px;background:var(--accent);color:#08251f;display:grid;place-items:center;font-weight:900;font-size:25px}.head h1{font-size:22px;margin:0}.head p{margin:3px 0 0;color:var(--muted);font-size:13px}.status{margin-left:auto;font-size:12px;color:var(--muted)}.messages{flex:1;display:flex;flex-direction:column;gap:12px;padding:8px 0 18px}.bubble{max-width:92%;padding:13px 15px;border:1px solid var(--line);border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:var(--panel)}.user{align-self:flex-end;background:#1e4c4c;border-color:#2d7770}.composer{position:sticky;bottom:0;background:#0b1422;padding:10px 0 max(8px,env(safe-area-inset-bottom));display:flex;gap:8px}.composer textarea{flex:1;resize:vertical;min-height:52px;max-height:160px;border-radius:14px;border:1px solid var(--line);background:#101f31;color:var(--text);padding:13px;font:inherit}.composer button{border:0;border-radius:14px;background:var(--accent);color:#06251d;font-weight:800;padding:0 18px;min-width:78px}.composer button:disabled{opacity:.55}.note{font-size:12px;color:var(--muted);text-align:center}.err{color:#ffd2cb}@media(max-width:500px){.app{padding:12px}.status{max-width:105px;text-align:right}.bubble{max-width:96%}}
</style></head>
<body><main class="app"><header class="head"><div class="logo">A</div><div><h1>Atlas Assistente</h1><p>Construção civil • Orçamentos • Dia a dia</p></div><div id="status" class="status">Conectando…</div></header><section id="messages" class="messages" aria-live="polite"><div class="bubble bot">Olá! Sou o Atlas. Escreva sua pergunta para começarmos.</div></section><form id="form" class="composer"><textarea id="message" placeholder="Escreva sua pergunta…" required rows="1"></textarea><button id="send" type="submit">Enviar</button></form><div class="note">Não compartilhe senhas ou dados bancários nesta conversa.</div></main>
<script>
const messages=document.querySelector('#messages'), form=document.querySelector('#form'), input=document.querySelector('#message'), send=document.querySelector('#send'), statusEl=document.querySelector('#status');
function bubble(text,who='bot',extra=''){const el=document.createElement('div');el.className='bubble '+who+(extra?' '+extra:'');el.textContent=text;messages.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'end'});return el}
async function health(){try{const r=await fetch('/api/health');const d=await r.json();statusEl.textContent=d.aiConfigured?'IA conectada':'IA precisa de configuração';}catch{statusEl.textContent='Servidor indisponível'}}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;bubble(message,'user');input.value='';send.disabled=true;const wait=bubble('Pensando…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await r.json();wait.remove();if(!r.ok)bubble(d.error||'Não foi possível responder.','bot','err');else bubble(d.answer||'Não recebi uma resposta.');}catch{wait.remove();bubble('Não consegui conectar ao servidor. Verifique a implantação do Atlas.','bot','err')}finally{send.disabled=false;input.focus();}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});health();
</script></body></html>
